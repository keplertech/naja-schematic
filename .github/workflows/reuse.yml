name: REUSE Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        # No submodules: thirdparty/imgui and thirdparty/naja carry their
        # own licensing and are out of scope for this repo's REUSE check
        # (reuse lint skips git submodules by default anyway).

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5
